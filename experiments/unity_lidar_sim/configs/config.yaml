# Scene / model / render configuration for unity_predict.py (batch) and
# unity_online.py (streaming). Both drivers read the same schema; the last
# section only applies to unity_online.py and is ignored by unity_predict.py.
# Command-line flags stay limited to what actually changes run-to-run
# (--gpu, --style, --format); everything else lives here. To run a
# different scene, either edit data_dir below or copy this file and pass
# --config my_scene.yaml.

# Directory containing gt_agents.json + poses.csv for one scene.
data_dir: unity_data/sweep_s1_hdl_frame_fixed

# Pre-trained model (weights are only trained at 2Hz, see stride below).
model_dir: ../nuScenes/models/int_ee_me
model_ts: 12

stride: 5              # resample source frames (10Hz) -> 2Hz
ph: 6                   # prediction horizon, steps @2Hz (6 = 3s)
num_samples: 200        # Monte Carlo samples per predicted node

frame_stride: 1         # render every k-th timestep in the video
single_t: null          # render just one timestep (debug); null = full video
ego_frame: false        # render zoomed-in, ego at origin heading up
zoom: 80.0               # ego-frame half-window in metres
fps: 5.0                  # output video frame rate

out_dir: null             # null = unity_out/<data_dir name>
pred_file: null            # null = <out_dir>/predictions.pkl  (unity_online.py: predictions_online.pkl)
save_env: false            # also dump the built Environment pkl
no_viz: false                # predict only, skip rendering (re-render later with visualize.py)

# Drivable/undrivable raster for the VEHICLE map encoder + viz backdrop (see
# unity_maps/handoff.md). It's a soft prior, not a hard mask -- the model can still place
# probability mass off it (e.g. an ambulance cutting across lanes), just less likely.
# Set either to null to fall back to a blank (uninformative) map.
map_png: unity_maps/Demo_drivable.png
map_json: unity_maps/Demo_drivable.json

# Whether to feed the drivable map to the MODEL's map encoder. Set false to run inference
# on a blank map (kinematics + interactions only) while STILL drawing the drivable raster
# as the visualization backdrop -- i.e. see predictions with no map context on top of the
# road layout. (Setting map_png/map_json null instead removes the map from both.)
map_for_model: true

# --------------------------------------------------------------------------- #
# unity_online.py only (ignored by unity_predict.py)                           #
# --------------------------------------------------------------------------- #

# Observations streamed into the encoders before the first prediction; the first predicted
# timestep is warmup_timesteps + 1. These passes run the encoders but not the decoder, so
# each agent's LSTM already holds context when its first prediction is made instead of
# starting from a zero hidden state. Measured on sweep_s1_rail, warming up over t=0,1 puts
# the t=2 prediction 0.9 m from the batch driver's vs 3.2 m with a cold start; the two
# converge by t~12 as the cold LSTM accumulates its own observations. Raise it if you want
# the first scored timesteps to be closer to steady state, at the cost of starting later.
warmup_timesteps: 1

# How many observations an agent needs before the model is allowed to predict for it. Its
# encoders start advancing from its very first observation either way -- this only gates
# when its output is emitted. 1 means "from its second observation onwards", which is the
# same rule unity_predict.py applies via min_history_timesteps, so the two drivers predict
# for the same agents at the same timesteps. 0 predicts from a single observation, where
# velocity/acceleration are still one-sided finite differences.
min_history_timesteps: 1

# Feed the ego's planned future to the model (Trajectron++ `incl_robot_node`). The ego stops
# being invisible to the network: it joins the scene as the robot node, so it is a neighbour
# in the interaction graph, and a bi-LSTM over its plan across the horizon is concatenated
# into every agent's condition vector -- agents are then predicted given where the ego is
# going. Needs a checkpoint trained with incl_robot_node: true (int_ee_me is not one); both
# drivers refuse to start if the config and the checkpoint disagree. With ego_path_mode:
# logged the ego's logged future is used as its plan, which is fair when the ego is the
# vehicle being planned for -- a planner knows its own intended path.
ego_conditioning: false

# Reference path the crossing risk is measured against at each timestep:
#   logged     the ego's actual future over the horizon. Matches what unity_predict.py
#              stores and what risk_eval.py scores, so online and batch runs are directly
#              comparable -- but it uses information not causally available at time t.
#   projected  constant-velocity dead reckoning from the ego's current pose, i.e. the
#              reference path an online planner would actually have. Use this for a fully
#              causal run; risk values are NOT comparable to a `logged` run.
ego_path_mode: logged

# Temporal slack (in horizon steps) for a crossing to count: the agent and the ego must
# reach the crossing point within this many steps of each other. 0 = strictly simultaneous;
# -1 = ignore timing (pure geometric crossing). Same meaning as risk_eval.py --time_window.
risk_time_window: 1

risk_file: null            # null = <out_dir>/risk_online.csv
