# Streaming (unity_online.py) run of sweep_s1_rail. Scene/model settings match
# configs/sweep_s1_rail.yaml so the online and batch results are comparable; only
# out_dir and the online-specific keys differ. See config.yaml for every key.
data_dir: unity_data/sweep_s1_rail

model_dir: ../nuScenes/models/int_ee_me
model_ts: 12

stride: 5
ph: 10
num_samples: 1000

ego_frame: true
zoom: 100.0
fps: 2.0

out_dir: unity_out/sweep_s1_rail_online
pred_file: null            # -> unity_out/sweep_s1_rail_online/predictions_online.pkl
save_env: false
no_viz: true               # predict + score only; render later with visualize.py

map_png: unity_maps/Demo_drivable.png
map_json: unity_maps/Demo_drivable.json
map_for_model: true

# --- online ---------------------------------------------------------------- #
warmup_timesteps: 1
min_history_timesteps: 1   # same agent-eligibility rule as the batch driver
ego_path_mode: logged      # context path stored in the bundle; not used by the risk metric
risk_radius: 25.0          # ego keep-out disc, metres
risk_file: null            # -> unity_out/sweep_s1_rail_online/risk_online.csv
